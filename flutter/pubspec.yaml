name: ai_chatbot
description: AI Chatbot Flutter Application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # HTTP & WebSocket
  http: ^1.2.0
  web_socket_channel: ^3.0.3

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  flutter_dotenv: ^6.0.0

  # UI Components
  flutter_markdown_plus: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/
